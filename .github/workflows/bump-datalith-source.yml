name: Bump Datalith source

# Dispatched by datalith-app after a stable release. Points DATALITH_SOURCE_REF at the new tag in a PR,
# so CI tests the new assets before they are merged.
on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Stable datalith-app tag, for example v1.2.0"
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: bump-datalith-source
    cancel-in-progress: false

jobs:
    bump:
        runs-on: ubuntu-latest
        steps:
            - name: Validate tag
              env:
                  TAG: ${{ inputs.tag }}
              run: |
                  if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::'$TAG' is not a stable tag (expected vX.Y.Z)"
                      exit 1
                  fi
                  if [ -z "$(git ls-remote --tags https://github.com/mycelium-build/datalith-app "refs/tags/$TAG")" ]; then
                      echo "::error::Tag $TAG does not exist on mycelium-build/datalith-app"
                      exit 1
                  fi

            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  persist-credentials: false

            - name: Update DATALITH_SOURCE_REF
              id: edit
              env:
                  TAG: ${{ inputs.tag }}
              run: |
                  grep -rlE '^\s*DATALITH_SOURCE_REF:' .github/workflows | xargs sed -i -E "s/^(\s*DATALITH_SOURCE_REF:).*/\1 ${TAG}/"
                  if git diff --quiet; then
                      echo "DATALITH_SOURCE_REF already points at $TAG"
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            # Created only now, after the edit, and for this repository only.
            # A push made with the App token starts a CI run; one made with GITHUB_TOKEN would not.
            - name: Create datalith-bot token
              if: steps.edit.outputs.changed == 'true'
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
                  private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - name: Push branch and open pull request
              if: steps.edit.outputs.changed == 'true'
              env:
                  TAG: ${{ inputs.tag }}
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  branch="chore/datalith-source-${TAG}"
                  title="chore(ci): use datalith-app ${TAG}"
                  body="Points \`DATALITH_SOURCE_REF\` at datalith-app ${TAG}: https://github.com/mycelium-build/datalith-app/releases/tag/${TAG}"
                  git config user.name "datalith-bot"
                  git config user.email "datalith-bot@users.noreply.github.com"
                  git checkout -b "$branch"
                  git commit -am "$title"
                  git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:refs/heads/${branch}"
                  existing="$(gh pr list --repo "$REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')"
                  if [ -n "$existing" ]; then
                      gh pr edit "$existing" --repo "$REPOSITORY" --title "$title" --body "$body"
                  else
                      gh pr create --repo "$REPOSITORY" --base main --head "$branch" --title "$title" --body "$body"
                  fi
