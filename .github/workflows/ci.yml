name: CI

on:
    pull_request:
    push:
        branches:
            - main

# Cancel superseded PR runs only; every push to main keeps its own result.
concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

env:
    # Pinned tag of mycelium-build/datalith-app whose assets are bundled. Bump it deliberately in a commit:
    # tracking `main` makes a CI result depend on a repository this commit does not contain.
    DATALITH_SOURCE_REF: v1.1.0

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Create datalith-bot token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
                  private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
                  owner: mycelium-build
                  repositories: datalith-app
                  permission-contents: read

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Sync assets
              env:
                  DATALITH_READ_TOKEN: ${{ steps.app-token.outputs.token }}
              run: npm run sync-assets

            # Cheapest checks first so a formatting or lint error fails before the build.
            - name: Check formatting
              run: npm run fmt:check

            - name: Lint
              run: npm run lint

            - name: Check license notices
              run: npm run licenses:check

            - name: Build
              run: npm run build

            - name: Typecheck
              run: npm run typecheck

            - name: Run tests
              run: npm test
