name: CI

on:
    pull_request:
    push:
        branches:
            - main

# Cancel superseded PR runs only; every push to main keeps its own result.
concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

# A job is skipped only on an explicit answer (verified 'true', code 'false'): an empty output from a failed job runs everything.
jobs:
    # On main, skip everything when the pull request that was just merged already verified this tree.
    reuse:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
            checks: read
        outputs:
            verified: ${{ steps.verified.outputs.verified }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  sparse-checkout: scripts/ci
                  persist-credentials: false

            - name: Look for a verified pull request
              id: verified
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  SHA: ${{ github.sha }}
                  CHECK_NAME: quality
              run: scripts/ci/verified-tree.sh

    # Decides whether anything that is tested changed. Pull requests are compared with the base branch
    # (the checkout is the merge commit, whose first parent is the base); pushes with the previous tip.
    changes:
        needs: reuse
        if: ${{ !cancelled() && needs.reuse.outputs.verified != 'true' }}
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.changes.outputs.code }}
            licenses: ${{ steps.changes.outputs.licenses }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 2
                  persist-credentials: false

            - name: Detect changed inputs
              id: changes
              env:
                  EVENT: ${{ github.event_name }}
                  BEFORE: ${{ github.event.before }}
              run: |
                  if [ "$EVENT" = pull_request ]; then
                      base=HEAD^1
                  else
                      base="$BEFORE"
                      git fetch --no-tags --depth=1 origin "$base" || base=""
                  fi
                  scripts/ci/changes.sh "$base"

    # Formatting also covers the Markdown and config files that `quality` skips, so it always runs.
    format:
        needs: reuse
        if: ${{ !cancelled() && needs.reuse.outputs.verified != 'true' }}
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Check formatting
              run: npm run fmt:check

    quality:
        needs: [reuse, changes]
        # Skipped at job level when the tree is verified or nothing tested changed: a skipped required check passes.
        if: ${{ !cancelled() && needs.reuse.outputs.verified != 'true' && needs.changes.outputs.code != 'false' }}
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Sync assets
              env:
                  GH_TOKEN: ${{ github.token }}
              run: npm run sync-assets

            - name: Lint
              run: npm run lint

            # Assets move with stable releases. Keep the committed npm notices checked;
            # Build validates asset license files and renders complete notices into each ZIP.
            - name: Check dependency license notices
              if: needs.changes.outputs.licenses != 'false'
              run: npm run licenses:check -- --dependencies-only

            - name: Build
              env:
                  GH_TOKEN: ${{ github.token }}
              run: npm run build

            - name: Typecheck
              run: npm run typecheck

            - name: Run tests
              run: npm test
