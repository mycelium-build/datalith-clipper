name: Dependabot notices

# THIRD-PARTY-NOTICES.md lists dependency versions, so every Dependabot npm bump makes `licenses:check` fail.
# Regenerate the notices and push them to the PR branch.
on:
    pull_request:
        paths:
            - package.json
            - package-lock.json

permissions:
    contents: read

concurrency:
    group: dependabot-notices-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    notices:
        if: github.actor == 'dependabot[bot]'
        runs-on: ubuntu-latest
        steps:
            - name: Check out pull request branch
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Regenerate notices
              run: npm run licenses:generate

            - name: Detect changes
              id: diff
              run: |
                  if git diff --quiet -- THIRD-PARTY-NOTICES.md; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            # Created only now, and with write access to this repository only, so unchanged PRs never use the App.
            # A push made with the App token starts a fresh CI run; one made with GITHUB_TOKEN would not.
            - name: Create datalith-bot token
              if: steps.diff.outputs.changed == 'true'
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
                  private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
                  permission-contents: write

            - name: Commit and push notices
              if: steps.diff.outputs.changed == 'true'
              env:
                  TOKEN: ${{ steps.app-token.outputs.token }}
                  BRANCH: ${{ github.event.pull_request.head.ref }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  git config user.name "datalith-bot"
                  git config user.email "datalith-bot@users.noreply.github.com"
                  git add THIRD-PARTY-NOTICES.md
                  git commit -m "chore(deps): regenerate third-party notices"
                  git push "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
