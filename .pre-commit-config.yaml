# Local Git hooks that mirror CI checks. Managed with prek (a pre-commit compatible runner):
#   prek install          # once per clone; installs the pre-commit and pre-push hooks
#   prek run --all-files  # run every pre-commit hook on the whole tree
# Bypass once with `git commit --no-verify` / `git push --no-verify`. See CONTRIBUTING.md.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
    - repo: local
      hooks:
          # Formats the committed files with Vite+ and stages the result.
          - id: format
            name: vp fmt
            language: system
            entry: scripts/hooks/format.sh
            # One process: parallel batches would race on git add (.git/index.lock).
            require_serial: true
            types_or: [ts, tsx, javascript, json, css, markdown, yaml]
            exclude: ^(package-lock\.json|THIRD-PARTY-NOTICES\.md)$

          - id: lint
            name: vp lint
            language: system
            entry: npx --no-install vp lint
            types_or: [ts, tsx, javascript]

          - id: stylelint
            name: stylelint
            language: system
            entry: npx --no-install stylelint
            files: ^src/styles/[^/]+\.css$

          # The inputs of CI's "Check license notices" step. Regenerates and stages stale notices.
          - id: licenses-check
            name: license notices
            language: system
            entry: scripts/hooks/license-notices.sh
            files: ^(package\.json|package-lock\.json|THIRD-PARTY-NOTICES\.md|LICENSE|scripts/licenses/)
            pass_filenames: false

          # Same commands as CI's "Typecheck" and "Run tests" steps, on push only.
          - id: typecheck
            name: tsc --noEmit
            language: system
            entry: npm run --silent typecheck
            files: \.(ts|tsx|json)$
            pass_filenames: false
            stages: [pre-push]

          - id: test
            name: vp test
            language: system
            entry: npm test --silent
            files: ^(src|test|scripts)/|^package(-lock)?\.json$
            pass_filenames: false
            stages: [pre-push]
